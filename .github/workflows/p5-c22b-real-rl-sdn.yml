
name: P5 C22B - Real RL SDN Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-rl-sdn:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SDN and RL dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mininet openvswitch-switch openvswitch-common \
            iproute2 iputils-ping python3-venv

          sudo systemctl start openvswitch-switch
          sudo mn -c

          python3 -m venv /tmp/p5-osken
          /tmp/p5-osken/bin/pip install os-ken==3.1.1

          python3 -m venv /tmp/p5-rl
          /tmp/p5-rl/bin/pip install \
            stable-baselines3==2.9.2

          echo "[PASS] Dependencies installed"

      - name: Verify real trained checkpoints
        run: |
          test -f models/rl/dqn_digital_twin_best_v1.zip || {
            echo "Missing real DQN checkpoint"
            exit 1
          }

          test -f models/rl/ppo_digital_twin_best_v1.zip || {
            echo "Missing real PPO checkpoint"
            exit 1
          }

          sha256sum models/rl/*_digital_twin_best_v1.zip

          echo "[PASS] Both real checkpoint files exist"

      - name: Run trained DQN and PPO CPU inference
        run: |
          cat > /tmp/p5_c22b_inference.py <<'PY'
          import json
          import hashlib
          from pathlib import Path

          import numpy as np
          from stable_baselines3 import DQN, PPO

          ACTIONS = {
              0: "ALLOW",
              1: "INSPECT",
              2: "RATE_LIMIT",
              3: "REDIRECT",
              4: "BLOCK",
          }

          FEATURES = [
              "traffic_intensity",
              "queue_utilization",
              "estimated_latency",
              "bandwidth_utilization",
              "ids_risk_score",
              "device_trust_score",
              "service_health",
              "active_security_policy",
          ]

          # Controlled observations in V1 feature order.
          # These are not live IDS measurements.
          OBSERVATIONS = {
              "trusted": np.array([
                  0.20, 0.20, 0.20, 0.20,
                  0.10, 0.95, 0.90, 0.00
              ], dtype=np.float32),

              "high_risk": np.array([
                  0.85, 0.75, 0.70, 0.80,
                  0.90, 0.10, 0.60, 0.00
              ], dtype=np.float32),
          }

          def zero_trust(action, risk, trust):
              if trust < 0.20 and risk > 0.70:
                  return 4, "MANDATORY_BLOCK"

              if (
                  trust < 0.35
                  and risk > 0.55
                  and action == 0
              ):
                  return 1, "ESCALATE_TO_INSPECT"

              return action, "NO_OVERRIDE"

          models = {
              "DQN": (
                  DQN,
                  Path(
                      "models/rl/"
                      "dqn_digital_twin_best_v1.zip"
                  )
              ),
              "PPO": (
                  PPO,
                  Path(
                      "models/rl/"
                      "ppo_digital_twin_best_v1.zip"
                  )
              ),
          }

          evidence = {
              "cell": "P5_C22B",
              "model_source": "real_saved_checkpoints",
              "device": "cpu",
              "observation_features": FEATURES,
              "results": [],
          }

          for name, (model_class, path) in models.items():
              print(
                  "\n=== LOADING REAL " + name + " ===",
                  flush=True
              )

              model = model_class.load(
                  str(path),
                  device="cpu"
              )

              assert model.observation_space.shape == (8,), (
                  "Unexpected observation dimension"
              )

              assert model.action_space.n == 5, (
                  "Unexpected action space"
              )

              digest = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

              print("Checkpoint SHA256:", digest)
              print("[PASS] Model loaded on CPU")

              for scenario, observation in OBSERVATIONS.items():
                  assert observation.shape == (8,)
                  assert np.isfinite(observation).all()
                  assert np.all(observation >= 0)
                  assert np.all(observation <= 1)

                  prediction, _ = model.predict(
                      observation,
                      deterministic=True
                  )

                  action = int(np.asarray(prediction).item())
                  assert action in ACTIONS

                  risk = float(observation[4])
                  trust = float(observation[5])

                  final, reason = zero_trust(
                      action, risk, trust
                  )

                  record = {
                      "model": name,
                      "checkpoint_sha256": digest,
                      "scenario": scenario,
                      "observation": observation.tolist(),
                      "rl_action_id": action,
                      "rl_action": ACTIONS[action],
                      "final_action_id": final,
                      "final_action": ACTIONS[final],
                      "zero_trust_reason": reason,
                  }

                  evidence["results"].append(record)

                  print(
                      name,
                      scenario,
                      "RL =", ACTIONS[action],
                      "FINAL =", ACTIONS[final],
                      "REASON =", reason,
                      flush=True
                  )

                  if scenario == "high_risk":
                      assert final == 4
                      assert reason == "MANDATORY_BLOCK"

              print(
                  "[PASS] " + name + " inference",
                  flush=True
              )

          output = Path("/tmp/p5-c22b-inference.json")
          output.write_text(
              json.dumps(evidence, indent=2)
          )

          print(
              "\n[PASS] REAL DQN/PPO INFERENCE COMPLETE",
              flush=True
          )
          PY

          /tmp/p5-rl/bin/python \
            /tmp/p5_c22b_inference.py

      - name: Create custom OS-Ken policy controller
        run: |
          cat > /tmp/p5_c22b_controller.py <<'PY'
          import json
          import os

          from os_ken.base import app_manager
          from os_ken.controller import ofp_event
          from os_ken.controller.handler import (
              CONFIG_DISPATCHER,
              MAIN_DISPATCHER,
              DEAD_DISPATCHER,
              set_ev_cls,
          )
          from os_ken.lib import hub
          from os_ken.ofproto import ofproto_v1_3

          COMMAND = "/tmp/p5-c22b-command.json"
          ACK = "/tmp/p5-c22b-ack.json"
          COOKIE = 0x22B

          class P5C22BController(app_manager.OSKenApp):
              OFP_VERSIONS = [
                  ofproto_v1_3.OFP_VERSION
              ]

              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.datapaths = {}
                  self.last_id = None
                  self.worker = hub.spawn(
                      self.process_commands
                  )

              @set_ev_cls(
                  ofp_event.EventOFPSwitchFeatures,
                  CONFIG_DISPATCHER
              )
              def connected(self, ev):
                  dp = ev.msg.datapath
                  self.datapaths[dp.id] = dp
                  ofp = dp.ofproto
                  parser = dp.ofproto_parser

                  actions = [
                      parser.OFPActionOutput(
                          ofp.OFPP_CONTROLLER,
                          ofp.OFPCML_NO_BUFFER
                      )
                  ]

                  instructions = [
                      parser.OFPInstructionActions(
                          ofp.OFPIT_APPLY_ACTIONS,
                          actions
                      )
                  ]

                  dp.send_msg(parser.OFPFlowMod(
                      datapath=dp,
                      priority=0,
                      match=parser.OFPMatch(),
                      instructions=instructions
                  ))

                  self.logger.info(
                      "P5_C22B SWITCH_CONNECTED dpid=%s",
                      dp.id
                  )

              @set_ev_cls(
                  ofp_event.EventOFPStateChange,
                  DEAD_DISPATCHER
              )
              def disconnected(self, ev):
                  self.datapaths.pop(
                      ev.datapath.id, None
                  )

              @set_ev_cls(
                  ofp_event.EventOFPPacketIn,
                  MAIN_DISPATCHER
              )
              def packet_in(self, ev):
                  msg = ev.msg
                  dp = msg.datapath
                  ofp = dp.ofproto
                  parser = dp.ofproto_parser

                  dp.send_msg(parser.OFPPacketOut(
                      datapath=dp,
                      buffer_id=ofp.OFP_NO_BUFFER,
                      in_port=msg.match["in_port"],
                      actions=[
                          parser.OFPActionOutput(
                              ofp.OFPP_FLOOD
                          )
                      ],
                      data=msg.data
                  ))

              def process_commands(self):
                  while True:
                      try:
                          if os.path.isfile(COMMAND):
                              with open(COMMAND) as f:
                                  request = json.load(f)

                              rid = request["request_id"]

                              if rid != self.last_id:
                                  action = request["action"]
                                  self.apply_policy(action)
                                  self.last_id = rid

                                  tmp = ACK + ".tmp"
                                  with open(tmp, "w") as f:
                                      json.dump({
                                          "request_id": rid,
                                          "action": action,
                                          "status": "SENT"
                                      }, f)

                                  os.replace(tmp, ACK)

                                  self.logger.info(
                                      "P5_C22B POLICY %s %s",
                                      action, rid
                                  )

                      except Exception:
                          self.logger.exception(
                              "P5_C22B policy failure"
                          )

                      hub.sleep(0.1)

              def apply_policy(self, action):
                  if action not in ("ALLOW", "BLOCK"):
                      raise ValueError(
                          "Unsupported SDN action: " +
                          str(action)
                      )

                  if 1 not in self.datapaths:
                      raise RuntimeError(
                          "Switch 1 disconnected"
                      )

                  dp = self.datapaths[1]
                  ofp = dp.ofproto
                  parser = dp.ofproto_parser

                  match = parser.OFPMatch(
                      eth_type=0x0800,
                      ipv4_src="10.0.0.1",
                      ipv4_dst="10.0.0.2"
                  )

                  if action == "BLOCK":
                      mod = parser.OFPFlowMod(
                          datapath=dp,
                          cookie=COOKIE,
                          table_id=0,
                          priority=200,
                          match=match,
                          instructions=[]
                      )
                  else:
                      mod = parser.OFPFlowMod(
                          datapath=dp,
                          command=ofp.OFPFC_DELETE_STRICT,
                          cookie=COOKIE,
                          cookie_mask=0xffffffffffffffff,
                          table_id=0,
                          priority=200,
                          match=match,
                          out_port=ofp.OFPP_ANY,
                          out_group=ofp.OFPG_ANY
                      )

                  dp.send_msg(mod)
          PY

          echo "[PASS] Controller created"

      - name: Verify model decisions on real OVS
        run: |
          sudo python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time

          from pathlib import Path
          from mininet.net import Mininet
          from mininet.node import OVSSwitch, RemoteController
          from mininet.log import setLogLevel

          setLogLevel("warning")

          LOG = Path("/tmp/p5-c22b-controller.log")
          CMD = Path("/tmp/p5-c22b-command.json")
          ACK = Path("/tmp/p5-c22b-ack.json")

          evidence_path = Path(
              "/tmp/p5-c22b-inference.json"
          )

          evidence = json.loads(
              evidence_path.read_text()
          )

          controller = None
          net = None

          def flows():
              return subprocess.check_output(
                  [
                      "ovs-ofctl", "-O",
                      "OpenFlow13",
                      "dump-flows", "s1"
                  ],
                  text=True
              )

          def block_present():
              return any(
                  "priority=200" in line
                  and "nw_src=10.0.0.1" in line
                  and "nw_dst=10.0.0.2" in line
                  and "actions=drop" in line
                  for line in flows().splitlines()
              )

          def wait_for(label, predicate):
              deadline = time.monotonic() + 30

              while time.monotonic() < deadline:
                  if controller.poll() is not None:
                      raise RuntimeError(
                          "OS-Ken exited: " + label
                      )

                  if predicate():
                      print(
                          "[PASS] " + label,
                          flush=True
                      )
                      return

                  time.sleep(0.25)

              raise AssertionError(
                  "Timed out: " + label
              )

          def connected():
              output = subprocess.check_output(
                  [
                      "ovs-vsctl",
                      "--columns=is_connected",
                      "list", "Controller"
                  ],
                  text=True
              )

              return bool(re.search(
                  r"is_connected\s*:\s*true",
                  output
              ))

          def send(action, rid):
              ACK.unlink(missing_ok=True)

              tmp = CMD.with_suffix(".tmp")
              tmp.write_text(json.dumps({
                  "request_id": rid,
                  "action": action
              }))
              os.replace(tmp, CMD)

              def accepted():
                  if not ACK.exists():
                      return False

                  reply = json.loads(
                      ACK.read_text()
                  )

                  return (
                      reply.get("request_id") == rid
                      and reply.get("action") == action
                      and reply.get("status") == "SENT"
                  )

              wait_for(
                  "Controller accepted " + rid,
                  accepted
              )

              wait_for(
                  "OVS reflects " + action,
                  block_present if action == "BLOCK"
                  else lambda: not block_present()
              )

          def loss(host):
              result = host.cmd(
                  "ping -n -c 3 -W 2 10.0.0.2"
              )

              print(result, flush=True)

              match = re.search(
                  r"(\d+(?:\.\d+)?)%\s+packet loss",
                  result
              )

              if match is None:
                  raise AssertionError(
                      "Cannot parse ping result"
                  )

              return float(match.group(1))

          try:
              CMD.unlink(missing_ok=True)
              ACK.unlink(missing_ok=True)

              with LOG.open("w") as logfile:
                  controller = subprocess.Popen(
                      [
                          "/tmp/p5-osken/bin/osken-manager",
                          "--ofp-listen-host",
                          "127.0.0.1",
                          "--ofp-tcp-listen-port",
                          "6653",
                          "/tmp/p5_c22b_controller.py"
                      ],
                      stdout=logfile,
                      stderr=subprocess.STDOUT,
                      env={
                          **os.environ,
                          "PYTHONUNBUFFERED": "1"
                      }
                  )

                  net = Mininet(
                      controller=None,
                      switch=OVSSwitch,
                      autoSetMacs=True,
                      build=False
                  )

                  net.addController(
                      "c0",
                      controller=RemoteController,
                      ip="127.0.0.1",
                      port=6653
                  )

                  h1 = net.addHost(
                      "h1",
                      ip="10.0.0.1/24"
                  )

                  h2 = net.addHost(
                      "h2",
                      ip="10.0.0.2/24"
                  )

                  s1 = net.addSwitch(
                      "s1",
                      protocols="OpenFlow13",
                      failMode="secure",
                      dpid="0000000000000001"
                  )

                  net.addLink(h1, s1)
                  net.addLink(h2, s1)

                  net.build()
                  net.start()

                  wait_for(
                      "Controller connected",
                      connected
                  )

                  wait_for(
                      "OpenFlow switch handshake",
                      lambda:
                      "P5_C22B SWITCH_CONNECTED dpid=1"
                      in LOG.read_text()
                  )

                  wait_for(
                      "Table-miss rule installed",
                      lambda:
                      "actions=CONTROLLER" in flows()
                  )

                  network_results = []

                  for model_name in ("DQN", "PPO"):
                      records = [
                          item
                          for item in evidence["results"]
                          if (
                              item["model"] == model_name
                              and item["scenario"] == "high_risk"
                          )
                      ]

                      assert len(records) == 1
                      prediction = records[0]

                      assert (
                          prediction["final_action"] == "BLOCK"
                      )

                      assert (
                          prediction["zero_trust_reason"]
                          == "MANDATORY_BLOCK"
                      )

                      print(
                          "\n=== " + model_name +
                          " MODEL -> ZERO TRUST -> SDN ===",
                          flush=True
                      )

                      print(
                          "Real RL prediction:",
                          prediction["rl_action"],
                          flush=True
                      )

                      print(
                          "Final zero-trust action:",
                          prediction["final_action"],
                          flush=True
                      )

                      send(
                          prediction["final_action"],
                          model_name + "-block"
                      )

                      print(flows(), flush=True)

                      blocked = loss(h1)
                      assert blocked == 100.0, (
                          model_name + " BLOCK failed"
                      )

                      print(
                          "[PASS] " + model_name +
                          " policy enforced: 100% loss",
                          flush=True
                      )

                      # Administrative test reset.
                      # This is not an RL prediction.
                      send(
                          "ALLOW",
                          model_name + "-test-reset"
                      )

                      restored = loss(h1)
                      assert restored == 0.0, (
                          model_name + " reset failed"
                      )

                      network_results.append({
                          "model": model_name,
                          "prediction": prediction["rl_action"],
                          "final_action": "BLOCK",
                          "block_packet_loss": blocked,
                          "administrative_reset_loss": restored,
                      })

                      print(
                          "[PASS] " + model_name +
                          " test reset",
                          flush=True
                      )

                  log_text = LOG.read_text()

                  for name in ("DQN", "PPO"):
                      assert (
                          "P5_C22B POLICY BLOCK "
                          + name + "-block"
                      ) in log_text

                  evidence["network_results"] = network_results
                  evidence["status"] = "PASS"
                  evidence["enforcement_scope"] = (
                      "High-risk zero-trust BLOCK; "
                      "other predicted actions audited only"
                  )

                  evidence_path.write_text(
                      json.dumps(evidence, indent=2)
                  )

                  print(
                      "\n" + "=" * 65,
                      flush=True
                  )
                  print("P5_C22B RESULTS", flush=True)
                  print("Real DQN inference     : PASS")
                  print("Real PPO inference     : PASS")
                  print("8-feature observation : PASS")
                  print("Zero-trust integration : PASS")
                  print("DQN high-risk BLOCK    : PASS")
                  print("PPO high-risk BLOCK    : PASS")
                  print("OpenFlow enforcement   : PASS")
                  print("Recovery tests         : PASS")
                  print("P5_C22B                 : PASS")
                  print("=" * 65, flush=True)

          finally:
              if net is not None:
                  net.stop()

              if controller is not None:
                  controller.terminate()

                  try:
                      controller.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      controller.kill()
                      controller.wait()
          PY

      - name: Upload Cell 22B evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p5-c22b-real-rl-evidence
          path: /tmp/p5-c22b-inference.json
          retention-days: 30

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo "=== Controller log ==="
          sudo tail -150 \
            /tmp/p5-c22b-controller.log || true

          echo "=== OVS controller state ==="
          sudo ovs-vsctl list Controller || true

          echo "=== OpenFlow table ==="
          sudo ovs-ofctl -O OpenFlow13 \
            dump-flows s1 || true

      - name: Clean up Mininet
        if: always()
        run: sudo mn -c || true
