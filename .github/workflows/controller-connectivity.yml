
name: Phase 5 - OpenFlow Controller Connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install SDN dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mininet \
            openvswitch-switch \
            openvswitch-common \
            openvswitch-testcontroller \
            iproute2 \
            iputils-ping

          sudo systemctl start openvswitch-switch
          sudo mn -c

      - name: Test controller and switch connectivity
        run: |
          sudo python3 - <<'PY'
          import subprocess
          import time
          import re
          import socket

          from mininet.net import Mininet
          from mininet.node import OVSSwitch, RemoteController
          from mininet.log import setLogLevel

          setLogLevel("warning")

          print("=" * 65, flush=True)
          print("P5_C20 | OPENFLOW 1.3 CONTROLLER CONNECTIVITY", flush=True)
          print("=" * 65, flush=True)

          controller = None
          net = None

          def cmd(*args):
              return subprocess.run(
                  args,
                  check=True,
                  text=True,
                  capture_output=True
              ).stdout

          try:
              # Start a temporary testing controller.
              controller = subprocess.Popen(
                  [
                      "ovs-testcontroller",
                      "-O", "OpenFlow13",
                      "ptcp:6653:127.0.0.1"
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True
              )

              # Wait until the controller is listening.
              listening = False
              for attempt in range(30):
                  if controller.poll() is not None:
                      raise RuntimeError(
                          "Testing controller exited unexpectedly"
                      )
                  try:
                      with socket.create_connection(
                          ("127.0.0.1", 6653), timeout=1
                      ):
                          listening = True
                          break
                  except OSError:
                      time.sleep(0.2)

              assert listening, "Controller did not start"
              print("[PASS] Controller listening on localhost:6653",
                    flush=True)

              net = Mininet(
                  controller=None,
                  switch=OVSSwitch,
                  autoSetMacs=True,
                  build=False
              )

              net.addController(
                  "c0",
                  controller=RemoteController,
                  ip="127.0.0.1",
                  port=6653
              )

              h1 = net.addHost("h1", ip="10.0.0.1/24")
              h2 = net.addHost("h2", ip="10.0.0.2/24")

              s1 = net.addSwitch(
                  "s1",
                  protocols="OpenFlow13",
                  failMode="secure"
              )

              net.addLink(h1, s1)
              net.addLink(h2, s1)

              net.build()
              net.start()

              # Verify actual OVS controller connection.
              connected = False

              for attempt in range(30):
                  status = cmd(
                      "ovs-vsctl",
                      "--columns=is_connected",
                      "list", "Controller"
                  )

                  if re.search(
                      r"is_connected\s*:\s*true",
                      status
                  ):
                      connected = True
                      break

                  time.sleep(0.3)

              assert connected, "OVS did not connect to controller"

              print("[PASS] OVS connected to external controller",
                    flush=True)

              # Verify the switch is restricted to OpenFlow 1.3.
              protocols = cmd(
                  "ovs-vsctl", "get", "Bridge",
                  "s1", "protocols"
              ).strip()

              assert "OpenFlow13" in protocols
              print("[PASS] Bridge supports OpenFlow13:", protocols,
                    flush=True)

              # Allow the controller to learn host MAC addresses.
              print("\n=== CONTROLLER-BASED PING TEST ===",
                    flush=True)

              loss = net.pingAll(timeout="2")

              print(f"Mininet packet loss: {loss}%", flush=True)

              assert loss == 0.0, (
                  f"Controller forwarding failed: {loss}% loss"
              )

              flows = cmd(
                  "ovs-ofctl", "-O", "OpenFlow13",
                  "dump-flows", "s1"
              )

              print("\n=== OPENFLOW TABLE ===", flush=True)
              print(flows, flush=True)

              assert "OFPST_FLOW reply (OF1.3)" in flows, (
                  "OpenFlow 1.3 flow table not confirmed"
              )

              print("\n===================================",
                    flush=True)
              print("P5_C20 RESULTS", flush=True)
              print("Controller startup : PASS", flush=True)
              print("OVS connection     : PASS", flush=True)
              print("OpenFlow 1.3       : PASS", flush=True)
              print("Controller network : PASS", flush=True)
              print("===================================",
                    flush=True)

          finally:
              if net is not None:
                  net.stop()

              if controller is not None:
                  controller.terminate()
                  try:
                      controller.communicate(timeout=5)
                  except subprocess.TimeoutExpired:
                      controller.kill()
                      controller.communicate()
          PY

      - name: Clean up Mininet
        if: always()
        run: sudo mn -c || true
