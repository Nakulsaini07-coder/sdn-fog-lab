
name: Phase 5 - Controller Policy Enforcement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install SDN components and OS-Ken
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mininet openvswitch-switch openvswitch-common \
            iproute2 iputils-ping python3-venv

          sudo systemctl start openvswitch-switch
          sudo mn -c

          python3 -m venv /tmp/p5-osken
          /tmp/p5-osken/bin/pip install os-ken==3.1.1
          /tmp/p5-osken/bin/osken-manager --help >/tmp/p5-osken-help.txt

          echo "[PASS] OS-Ken 3.1.1 installed"

      - name: P5_C21C custom controller ALLOW BLOCK RESTORE
        run: |
          cat > /tmp/p5_custom_controller.py <<'PY_CONTROLLER'
          import json
          import os
          from os_ken.base import app_manager
          from os_ken.controller import ofp_event
          from os_ken.controller.handler import CONFIG_DISPATCHER, MAIN_DISPATCHER, set_ev_cls
          from os_ken.lib import hub
          from os_ken.ofproto import ofproto_v1_3

          COMMAND_FILE = "/tmp/p5-policy-command.json"
          ACK_FILE = "/tmp/p5-policy-ack.json"
          COOKIE = 0x21C

          class P5CustomController(app_manager.OSKenApp):
              OFP_VERSIONS = [ofproto_v1_3.OFP_VERSION]

              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.datapaths = {}
                  self.last_request_id = None
                  self.policy_worker = hub.spawn(self.policy_loop)

              @set_ev_cls(ofp_event.EventOFPSwitchFeatures, CONFIG_DISPATCHER)
              def switch_features(self, ev):
                  dp = ev.msg.datapath
                  ofp = dp.ofproto
                  parser = dp.ofproto_parser
                  self.datapaths[dp.id] = dp

                  actions = [
                      parser.OFPActionOutput(
                          ofp.OFPP_CONTROLLER,
                          ofp.OFPCML_NO_BUFFER
                      )
                  ]

                  instructions = [
                      parser.OFPInstructionActions(
                          ofp.OFPIT_APPLY_ACTIONS,
                          actions
                      )
                  ]

                  dp.send_msg(parser.OFPFlowMod(
                      datapath=dp,
                      priority=0,
                      match=parser.OFPMatch(),
                      instructions=instructions
                  ))

                  self.logger.info(
                      "P5_CUSTOM_CONTROLLER: SWITCH_CONNECTED dpid=%s",
                      dp.id
                  )

              @set_ev_cls(ofp_event.EventOFPPacketIn, MAIN_DISPATCHER)
              def packet_in(self, ev):
                  msg = ev.msg
                  dp = msg.datapath
                  parser = dp.ofproto_parser
                  ofp = dp.ofproto

                  dp.send_msg(parser.OFPPacketOut(
                      datapath=dp,
                      buffer_id=ofp.OFP_NO_BUFFER,
                      in_port=msg.match["in_port"],
                      actions=[
                          parser.OFPActionOutput(ofp.OFPP_FLOOD)
                      ],
                      data=msg.data
                  ))

              def policy_loop(self):
                  while True:
                      try:
                          if os.path.isfile(COMMAND_FILE):
                              with open(
                                  COMMAND_FILE,
                                  encoding="utf-8"
                              ) as fh:
                                  request = json.load(fh)

                              request_id = request.get("request_id")

                              if request_id != self.last_request_id:
                                  self.last_request_id = request_id
                                  action = request.get("action")

                                  self.apply_policy(action)

                                  reply = {
                                      "request_id": request_id,
                                      "action": action,
                                      "status": "SENT"
                                  }

                                  temporary = ACK_FILE + ".tmp"

                                  with open(
                                      temporary,
                                      "w",
                                      encoding="utf-8"
                                  ) as fh:
                                      json.dump(reply, fh)

                                  os.replace(temporary, ACK_FILE)

                                  self.logger.info(
                                      "P5_POLICY: %s request_id=%s",
                                      action,
                                      request_id
                                  )

                      except Exception:
                          self.logger.exception(
                              "P5_POLICY: command processing error"
                          )

                      hub.sleep(0.1)

              def apply_policy(self, action):
                  if action not in ("BLOCK", "RESTORE"):
                      raise ValueError(
                          "Unsupported policy action: %r" % action
                      )

                  if 1 not in self.datapaths:
                      raise RuntimeError(
                          "Switch DPID 1 is not connected"
                      )

                  dp = self.datapaths[1]
                  ofp = dp.ofproto
                  parser = dp.ofproto_parser

                  match = parser.OFPMatch(
                      eth_type=0x0800,
                      ipv4_src="10.0.0.1",
                      ipv4_dst="10.0.0.2"
                  )

                  if action == "BLOCK":
                      # No output instructions means DROP.
                      mod = parser.OFPFlowMod(
                          datapath=dp,
                          cookie=COOKIE,
                          priority=200,
                          match=match,
                          instructions=[]
                      )

                  else:
                      # Remove only our matching BLOCK policy.
                      mod = parser.OFPFlowMod(
                          datapath=dp,
                          command=ofp.OFPFC_DELETE_STRICT,
                          cookie=COOKIE,
                          cookie_mask=0xffffffffffffffff,
                          table_id=0,
                          priority=200,
                          match=match,
                          out_port=ofp.OFPP_ANY,
                          out_group=ofp.OFPG_ANY
                      )

                  dp.send_msg(mod)
          PY_CONTROLLER

          sudo python3 - <<'PY_TEST'
          import json
          import os
          import re
          import subprocess
          import time

          from pathlib import Path
          from mininet.net import Mininet
          from mininet.node import OVSSwitch, RemoteController
          from mininet.log import setLogLevel

          setLogLevel("warning")

          CONTROLLER_LOG = Path("/tmp/p5-controller.log")
          CMD = Path("/tmp/p5-policy-command.json")
          ACK = Path("/tmp/p5-policy-ack.json")

          controller = None
          net = None

          def flows():
              return subprocess.check_output(
                  [
                      "ovs-ofctl",
                      "-O",
                      "OpenFlow13",
                      "dump-flows",
                      "s1"
                  ],
                  text=True
              )

          def block_present():
              for line in flows().splitlines():
                  if (
                      "priority=200" in line
                      and "nw_src=10.0.0.1" in line
                      and "nw_dst=10.0.0.2" in line
                      and "actions=drop" in line
                  ):
                      return True

              return False

          def wait_until(label, predicate, timeout=25):
              deadline = time.monotonic() + timeout

              while time.monotonic() < deadline:
                  if controller.poll() is not None:
                      raise RuntimeError(
                          "OS-Ken exited before " + label
                      )

                  if predicate():
                      print(
                          "[PASS] " + label,
                          flush=True
                      )
                      return

                  time.sleep(0.25)

              raise AssertionError(
                  "Timed out: " + label
              )

          def send_policy(action, request_id):
              ACK.unlink(missing_ok=True)

              payload = {
                  "action": action,
                  "request_id": request_id
              }

              temp = CMD.with_suffix(".tmp")

              temp.write_text(
                  json.dumps(payload),
                  encoding="utf-8"
              )

              os.replace(temp, CMD)

              def acknowledged():
                  if not ACK.exists():
                      return False

                  data = json.loads(
                      ACK.read_text(encoding="utf-8")
                  )

                  return (
                      data.get("request_id") == request_id
                      and data.get("action") == action
                      and data.get("status") == "SENT"
                  )

              wait_until(
                  "Controller accepted " + action + " policy",
                  acknowledged
              )

          def ping_loss(h1, ip):
              result = h1.cmd(
                  "ping -n -c 3 -W 2 " + ip
              )

              print(result, flush=True)

              match = re.search(
                  r"(\d+(?:\.\d+)?)%\s+packet loss",
                  result
              )

              if not match:
                  raise AssertionError(
                      "Cannot parse ping output"
                  )

              return float(match.group(1))

          try:
              for path in (CMD, ACK):
                  path.unlink(missing_ok=True)

              with CONTROLLER_LOG.open("w") as log:
                  controller = subprocess.Popen(
                      [
                          "/tmp/p5-osken/bin/osken-manager",
                          "--ofp-listen-host",
                          "127.0.0.1",
                          "--ofp-tcp-listen-port",
                          "6653",
                          "/tmp/p5_custom_controller.py"
                      ],
                      stdout=log,
                      stderr=subprocess.STDOUT,
                      env={
                          **os.environ,
                          "PYTHONUNBUFFERED": "1"
                      }
                  )

                  net = Mininet(
                      controller=None,
                      switch=OVSSwitch,
                      autoSetMacs=True,
                      build=False
                  )

                  net.addController(
                      "c0",
                      controller=RemoteController,
                      ip="127.0.0.1",
                      port=6653
                  )

                  h1 = net.addHost(
                      "h1",
                      ip="10.0.0.1/24"
                  )

                  h2 = net.addHost(
                      "h2",
                      ip="10.0.0.2/24"
                  )

                  s1 = net.addSwitch(
                      "s1",
                      protocols="OpenFlow13",
                      failMode="secure",
                      dpid="0000000000000001"
                  )

                  net.addLink(h1, s1)
                  net.addLink(h2, s1)

                  net.build()
                  net.start()

                  wait_until(
                      "OVS controller connected",
                      lambda: bool(re.search(
                          r"is_connected\s*:\s*true",
                          subprocess.check_output(
                              [
                                  "ovs-vsctl",
                                  "--columns=is_connected",
                                  "list",
                                  "Controller"
                              ],
                              text=True
                          )
                      )),
                      timeout=30
                  )

                  wait_until(
                      "OS-Ken switch handshake",
                      lambda:
                      "P5_CUSTOM_CONTROLLER: SWITCH_CONNECTED dpid=1"
                      in CONTROLLER_LOG.read_text(
                          encoding="utf-8"
                      )
                  )

                  wait_until(
                      "Table-miss flow installed",
                      lambda:
                      "actions=CONTROLLER" in flows()
                  )

                  print(
                      "\n=== BASELINE ALLOW ===",
                      flush=True
                  )

                  baseline = ping_loss(
                      h1,
                      "10.0.0.2"
                  )

                  assert baseline == 0.0, (
                      "Baseline forwarding failed"
                  )

                  print(
                      "[PASS] Baseline ALLOW (0% loss)",
                      flush=True
                  )

                  print(
                      "\n=== CONTROLLER BLOCK ===",
                      flush=True
                  )

                  send_policy(
                      "BLOCK",
                      "c21c-block-001"
                  )

                  wait_until(
                      "Controller-installed BLOCK flow present",
                      block_present
                  )

                  print(flows(), flush=True)

                  blocked = ping_loss(
                      h1,
                      "10.0.0.2"
                  )

                  assert blocked == 100.0, (
                      "BLOCK ineffective: %s%% loss" % blocked
                  )

                  print(
                      "[PASS] BLOCK (100% packet loss)",
                      flush=True
                  )

                  print(
                      "\n=== CONTROLLER RESTORE ===",
                      flush=True
                  )

                  send_policy(
                      "RESTORE",
                      "c21c-restore-002"
                  )

                  wait_until(
                      "Controller removed BLOCK flow",
                      lambda: not block_present()
                  )

                  print(flows(), flush=True)

                  restored = ping_loss(
                      h1,
                      "10.0.0.2"
                  )

                  assert restored == 0.0, (
                      "RESTORE failed: %s%% loss" % restored
                  )

                  print(
                      "[PASS] RESTORE (0% loss)",
                      flush=True
                  )

                  log_text = CONTROLLER_LOG.read_text(
                      encoding="utf-8"
                  )

                  assert (
                      "P5_POLICY: BLOCK request_id=c21c-block-001"
                      in log_text
                  )

                  assert (
                      "P5_POLICY: RESTORE request_id=c21c-restore-002"
                      in log_text
                  )

                  print(
                      "[PASS] Both policies originated "
                      "in custom OS-Ken controller",
                      flush=True
                  )

                  print(
                      "\n" + "=" * 64,
                      flush=True
                  )

                  print("P5_C21C RESULTS", flush=True)
                  print(
                      "Custom OS-Ken controller : PASS",
                      flush=True
                  )
                  print(
                      "OpenFlow 1.3 connection  : PASS",
                      flush=True
                  )
                  print(
                      "Baseline ALLOW           : 0% loss",
                      flush=True
                  )
                  print(
                      "Controller BLOCK         : 100% loss",
                      flush=True
                  )
                  print(
                      "Controller RESTORE       : 0% loss",
                      flush=True
                  )
                  print(
                      "P5_C21C CONTROLLER POLICY ENFORCEMENT: PASS",
                      flush=True
                  )
                  print("=" * 64, flush=True)

          finally:
              if net is not None:
                  net.stop()

              if controller is not None:
                  controller.terminate()

                  try:
                      controller.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      controller.kill()
                      controller.wait()
          PY_TEST

      - name: Show controller diagnostics on failure
        if: failure()
        run: |
          echo "=== OS-Ken controller log ==="

          if [ -f /tmp/p5-controller.log ]; then
            tail -150 /tmp/p5-controller.log
          fi

          echo "=== OVS status ==="
          sudo ovs-vsctl show || true
          sudo ovs-vsctl list Controller || true

          echo "=== OVS flows ==="
          sudo ovs-ofctl -O OpenFlow13 dump-flows s1 || true

      - name: Clean up Mininet
        if: always()
        run: sudo mn -c || true
