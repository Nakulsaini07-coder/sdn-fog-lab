
name: Phase 5 - Controller Policy Enforcement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install SDN components
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mininet openvswitch-switch openvswitch-common \
            iproute2 iputils-ping python3-venv

          sudo systemctl start openvswitch-switch
          sudo mn -c

          python3 -m venv /tmp/p5-osken
          /tmp/p5-osken/bin/pip install os-ken==3.1.1
          echo "=== OS-KEN EXECUTABLE CHECK ==="

          ls -l /tmp/p5-osken/bin/osken-manager
          
          /tmp/p5-osken/bin/osken-manager --help > /tmp/osken-help.txt
          
          echo "OS-KEN MANAGER: AVAILABLE"

          
          /tmp/p5-osken/bin/python - <<'PY'
          import os_ken
          import importlib.util
          import pkgutil

          print("=== OS-KEN PACKAGE ===")
          print("Package location:", os_ken.__file__)

          print("\n=== AVAILABLE APP MODULES ===")
          import os_ken.app
          for module in pkgutil.iter_modules(os_ken.app.__path__):
              print(module.name)

          print("\n=== CORE MODULE AVAILABILITY ===")
          required = [
              "os_ken.base.app_manager",
              "os_ken.controller.ofp_event",
              "os_ken.controller.handler",
              "os_ken.ofproto.ofproto_v1_3"
          ]

          for name in required:
              spec = importlib.util.find_spec(name)
              print(name, ":", "FOUND" if spec else "MISSING")
              assert spec is not None, name

          print("\nP5_C21 CORE MODULE DISCOVERY: PASS")
          PY


        
      - name: Test custom OS-Ken controller
        run: |
          cat > /tmp/p5_custom_controller.py <<'PY'
          from os_ken.base import app_manager
          from os_ken.controller import ofp_event
          from os_ken.controller.handler import (
              CONFIG_DISPATCHER, MAIN_DISPATCHER, set_ev_cls
          )
          from os_ken.ofproto import ofproto_v1_3

          class P5CustomController(app_manager.OSKenApp):
              OFP_VERSIONS = [ofproto_v1_3.OFP_VERSION]

              @set_ev_cls(
                  ofp_event.EventOFPSwitchFeatures,
                  CONFIG_DISPATCHER
              )
              def switch_features(self, ev):
                  dp = ev.msg.datapath
                  ofp = dp.ofproto
                  parser = dp.ofproto_parser

                  match = parser.OFPMatch()
                  actions = [
                      parser.OFPActionOutput(
                          ofp.OFPP_CONTROLLER,
                          ofp.OFPCML_NO_BUFFER
                      )
                  ]
                  instructions = [
                      parser.OFPInstructionActions(
                          ofp.OFPIT_APPLY_ACTIONS, actions
                      )
                  ]

                  flow = parser.OFPFlowMod(
                      datapath=dp,
                      priority=0,
                      match=match,
                      instructions=instructions
                  )
                  dp.send_msg(flow)

                  self.logger.info(
                      "P5_CUSTOM_CONTROLLER: SWITCH_CONNECTED dpid=%s",
                      dp.id
                  )

              @set_ev_cls(
                  ofp_event.EventOFPPacketIn,
                  MAIN_DISPATCHER
              )
              def packet_in(self, ev):
                  msg = ev.msg
                  dp = msg.datapath
                  ofp = dp.ofproto
                  parser = dp.ofproto_parser

                  in_port = msg.match["in_port"]
                  actions = [
                      parser.OFPActionOutput(ofp.OFPP_FLOOD)
                  ]

                  packet_out = parser.OFPPacketOut(
                      datapath=dp,
                      buffer_id=ofp.OFP_NO_BUFFER,
                      in_port=in_port,
                      actions=actions,
                      data=msg.data
                  )
                  dp.send_msg(packet_out)
          PY

          sudo python3 - <<'PY'
          import subprocess
          import time
          import re

          from mininet.net import Mininet
          from mininet.node import OVSSwitch, RemoteController
          from mininet.log import setLogLevel

          setLogLevel("warning")
          process = None
          net = None

          try:
              with open("/tmp/p5-controller.log", "w") as log:
                  process = subprocess.Popen(
                      [
                          "/tmp/p5-osken/bin/osken-manager",
                          "--ofp-listen-host", "127.0.0.1",
                          "--ofp-tcp-listen-port", "6653",
                          "/tmp/p5_custom_controller.py"
                      ],
                      stdout=log,
                      stderr=subprocess.STDOUT
                  )

                  time.sleep(3)
                  if process.poll() is not None:
                      raise RuntimeError(
                          "Custom OS-Ken controller exited early"
                      )

                  net = Mininet(
                      controller=None,
                      switch=OVSSwitch,
                      autoSetMacs=True,
                      build=False
                  )

                  net.addController(
                      "c0",
                      controller=RemoteController,
                      ip="127.0.0.1",
                      port=6653
                  )

                  h1 = net.addHost("h1", ip="10.0.0.1/24")
                  h2 = net.addHost("h2", ip="10.0.0.2/24")

                  s1 = net.addSwitch(
                      "s1",
                      protocols="OpenFlow13",
                      failMode="secure",
                      dpid="0000000000000001"
                  )

                  net.addLink(h1, s1)
                  net.addLink(h2, s1)
                  net.build()
                  net.start()

                  # Wait for the real connection instead of a one-shot readiness check.
                  connected = False
                  for attempt in range(1, 41):
                      if process.poll() is not None:
                          raise RuntimeError("OS-Ken controller exited")
                      status = subprocess.check_output(
                          ["ovs-vsctl", "--columns=is_connected", "list", "Controller"],
                          text=True
                      )
                      print(f"[CONNECTION CHECK {attempt}/40] {status.strip()}", flush=True)
                      if re.search(r"is_connected\s*:\s*true", status):
                          connected = True
                          break
                      time.sleep(0.5)
                  assert connected, "OVS controller was not connected after 20 seconds"
                  print("[PASS] Custom controller connected", flush=True)

                  # Verify our switch-features handler was really called.
                  handshake_seen = False
                  for attempt in range(1, 21):
                      with open("/tmp/p5-controller.log") as fh:
                          log_text = fh.read()
                      if "P5_CUSTOM_CONTROLLER: SWITCH_CONNECTED dpid=1" in log_text:
                          handshake_seen = True
                          break
                      time.sleep(0.25)
                  assert handshake_seen, "Custom switch-features handler not observed"
                  print("[PASS] Custom switch-features handler fired", flush=True)

                  # Flow installation is asynchronous, so retry the dataplane check too.
                  flow_found = False
                  for attempt in range(1, 21):
                      flows = subprocess.check_output(
                          ["ovs-ofctl", "-O", "OpenFlow13", "dump-flows", "s1"],
                          text=True
                      )
                      if "actions=CONTROLLER" in flows:
                          flow_found = True
                          break
                      time.sleep(0.25)
                  print(flows, flush=True)
                  assert flow_found, "Table-miss controller rule missing"
                  print("[PASS] Table-miss rule installed", flush=True)

                  print("\n=== CUSTOM CONTROLLER PING TEST ===", flush=True)
                  loss = net.pingAll(timeout="2")
                  print(f"Packet loss: {loss}%", flush=True)
                  assert loss == 0.0, f"Forwarding failed: {loss}% packet loss"

                  print("\nP5_C21B RESULTS", flush=True)
                  print("Custom controller : PASS", flush=True)
                  print("OpenFlow 1.3      : PASS", flush=True)
                  print("Packet forwarding : PASS", flush=True)

          except Exception:
              print("\n=== CONTROLLER DIAGNOSTICS ===", flush=True)
              subprocess.run(["ovs-vsctl", "show"], check=False)
              subprocess.run(
                  ["ovs-vsctl", "--columns=target,is_connected,status", "list", "Controller"],
                  check=False
              )
              if __import__("os").path.isfile("/tmp/p5-controller.log"):
                  print(open("/tmp/p5-controller.log").read(), flush=True)
              raise
          finally:
              if net is not None:
                  net.stop()

              if process is not None:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
          PY



      - name: Show controller logs if needed
        if: failure()
        run: |
          if [ -f /tmp/p5-controller.log ]; then
            tail -100 /tmp/p5-controller.log
          fi

      - name: Clean up Mininet
        if: always()
        run: sudo mn -c || true
