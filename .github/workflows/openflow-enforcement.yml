
name: Phase 5 - OpenFlow 1.3 Enforcement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openflow-enforcement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install SDN dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mininet openvswitch-switch openvswitch-common \
            iproute2 iputils-ping

          sudo systemctl start openvswitch-switch
          sudo mn -c

      - name: Test real OpenFlow enforcement
        run: |
          sudo python3 - <<'PY'
          import subprocess
          from mininet.net import Mininet
          from mininet.node import OVSSwitch
          from mininet.log import setLogLevel

          setLogLevel("warning")

          def run(*args):
              return subprocess.run(
                  args, check=True, text=True,
                  capture_output=True
              )

          def ping(host, destination):
              result = host.cmd(
                  f"ping -n -c 3 -W 1 {destination}"
              )
              print(result)
              return "0% packet loss" in result

          net = Mininet(
              controller=None,
              switch=OVSSwitch,
              autoSetMacs=True,
              build=False
          )

          try:
              h1 = net.addHost("h1", ip="10.0.0.1/24")
              h2 = net.addHost("h2", ip="10.0.0.2/24")

              s1 = net.addSwitch(
                  "s1",
                  protocols="OpenFlow13",
                  failMode="secure"
              )

              net.addLink(h1, s1)
              net.addLink(h2, s1)
              net.build()
              net.start()

              def ofctl(*args):
                  return run(
                      "ovs-ofctl", "-O", "OpenFlow13",
                      *args
                  )

              # Start with explicit forwarding.
              ofctl(
                  "add-flow", "s1",
                  "priority=0,actions=NORMAL"
              )

              print("\n=== BASELINE: ALLOW ===")
              baseline = ping(h1, "10.0.0.2")
              assert baseline, "Baseline connectivity failed"

              # Block h1 -> h2 IPv4 packets.
              print("\n=== APPLY BLOCK RULE ===")
              ofctl(
                  "add-flow", "s1",
                  "priority=200,ip,"
                  "nw_src=10.0.0.1,"
                  "nw_dst=10.0.0.2,"
                  "actions=drop"
              )

              print(ofctl("dump-flows", "s1").stdout)

              # ARP remains permitted. IPv4 ping is blocked.
              print("\n=== VERIFY BLOCK ===")
              blocked = not ping(h1, "10.0.0.2")
              assert blocked, "BLOCK rule did not stop ping"

              # Remove the specific security rule.
              print("\n=== RESTORE ALLOW ===")
              ofctl(
                  "--strict", "del-flows", "s1",
                  "priority=200,ip,"
                  "nw_src=10.0.0.1,"
                  "nw_dst=10.0.0.2"
              )

              restored = ping(h1, "10.0.0.2")
              assert restored, "Connectivity not restored"

              print("\n================================")
              print("P5_C19 RESULTS")
              print("Baseline ALLOW : PASS")
              print("OpenFlow BLOCK : PASS")
              print("Restore ALLOW  : PASS")
              print("REAL ENFORCEMENT: VERIFIED")
              print("================================")

          finally:
              net.stop()
          PY

      - name: Clean up Mininet
        if: always()
        run: sudo mn -c || true
