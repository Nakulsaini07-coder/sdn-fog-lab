
name: P5 C26A AI Decision Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-decision-bridge:

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip

          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install AI dependencies
        run: |
          python -m pip install \
            "stable-baselines3==2.9.2" \
            "scikit-learn==1.6.1" \
            joblib

      - name: Audit required project artifacts
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "models/ids/mlp_iid_adversarially_trained_v1.pt",
              "models/ids/preprocessor_iid_v1.joblib",
              "models/rl/dqn_digital_twin_best_v1.zip",
              "models/rl/ppo_digital_twin_best_v1.zip",
              "source/ids_preprocessing_adapter_v1.py",
              "source/observation_contract_v1.py",
              "source/p5_c26_ai_decision_bridge.py",
              "source/p5_c25_five_action_controller.py",
              "fixtures/p5_c23c_verified_raw_samples_v1.json",
          ]

          for filename in required:

              assert Path(filename).is_file(), (
                  "Missing: " + filename
              )

              print("[FOUND]", filename)

          print("[PASS] All required artifacts")
          PY

      - name: Execute AI decision bridge
        run: |
          mkdir -p results/p5_c26

          set -o pipefail

          python -u \
            source/p5_c26_ai_decision_bridge.py \
            2>&1 | tee results/p5_c26/inference.log

      - name: Display experimental summary
        if: always()
        run: |
          cat results/p5_c26/decision_bridge_summary.json || true

      - name: Upload experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-c26a-ai-decision-evidence
          path: results/p5_c26/
          retention-days: 90
